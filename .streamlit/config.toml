# Look and feel of the Streamlit page (picked up automatically by `streamlit run`).
[theme]
base = "dark"
primaryColor = "#3b82f6"           # buttons, active choices, focus rings
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#141d2e"
textColor = "#e5e7eb"
font = "sans serif"

[client]
toolbarMode = "minimal"   # hides the Deploy button and dev menu

[browser]
gatherUsageStats = false

[server]
headless = true
